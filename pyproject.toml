[project]
name = "apprentice-triage-app"
version = "0.1.0"
description = "Apprenticeship vacancy triage tool — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "langchain-google-genai>=4.4.0",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.1",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.23.1",
    "ruff>=0.4",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apprenticeship_navigator"]
